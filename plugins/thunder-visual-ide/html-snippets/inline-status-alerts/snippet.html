<div class="isa-alerts" data-isa-alerts>
    <div class="isa-alert isa-alert--success" role="status">
        <span>✓</span>
        <div>
            <strong>Changes saved</strong>
            <p>The profile is now up to date.</p>
        </div>
        <button type="button" data-isa-dismiss aria-label="Dismiss">×</button>
    </div>
    <div class="isa-alert isa-alert--warning" role="status">
        <span>!</span>
        <div>
            <strong>Review required</strong>
            <p>Two fields still need confirmation.</p>
        </div>
        <button type="button" data-isa-dismiss aria-label="Dismiss">×</button>
    </div>
    <div class="isa-alert isa-alert--danger" role="alert">
        <span>×</span>
        <div>
            <strong>Upload failed</strong>
            <p>The selected file exceeds the size limit.</p>
        </div>
        <button type="button" data-isa-dismiss aria-label="Dismiss">×</button>
    </div>
</div>

<article class="product-horizontal">
    <img class="product-horizontal__image" src="https://picsum.photos/id/96/560/560" alt="Wireless headphones">
    <div class="product-horizontal__content">
        <span class="product-horizontal__stock">In stock</span>
        <h3>Studio Wireless Headphones</h3>
        <p>Balanced sound, 40-hour battery and a lightweight over-ear design.</p>
        <div class="product-horizontal__meta">
            <strong>$129</strong>
            <span>Free delivery</span>
        </div>
    </div>
    <div class="product-horizontal__actions">
        <div class="product-horizontal__qty">
            <button type="button" data-qty-minus>−</button>
            <output data-qty>1</output>
            <button type="button" data-qty-plus>+</button>
        </div>
        <button type="button" class="product-horizontal__cart">Add to cart</button>
    </div>
</article>

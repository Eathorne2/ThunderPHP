<section class="compact-login-card">
    <div class="compact-login-card__mark" aria-hidden="true">⚡</div>
    <p class="compact-login-card__eyebrow">Account access</p>
    <h2>Welcome back</h2>
    <p class="compact-login-card__lead">Sign in using your email and password.</p>
    <form action="" method="post">
        <label>
            Email
            <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>
            Password
            <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
        </label>
        <div class="compact-login-card__row">
            <label class="remember">
                <input type="checkbox" name="remember">
                Stay signed in
            </label>
            <a href="#">Reset password</a>
        </div>
        <button type="submit">Continue</button>
    </form>
    <div class="compact-login-card__divider">
        <span>or</span>
    </div>
    <button type="button" class="compact-login-card__secondary">Continue with a security code</button>
</section>

<section class="cms-spl" data-cms-spl="">
    <div class="cms-spl__intro">
        <span>
            Start a conversation
        </span>
        <h2>
            Contact Map Split
        </h2>
        <p>
            Share a few details and the right member of our team will respond with a clear next step.
        </p>
        <div class="cms-spl__map">
            <span>
                Head office
            </span>
            <strong>
                18 Central Avenue
            </strong>
            <p>
                Open Monday to Friday
                <br/>
                08:00–17:00
            </p>
            <i aria-hidden="true">
                ⌖
            </i>
        </div>
    </div>
    <form class="cms-spl__form">
        <div class="cms-spl__row">
            <label>
                Full name
                <input name="name" placeholder="Your name" required=""/>
            </label>
            <label>
                Email address
                <input name="email" placeholder="name@example.com" required="" type="email"/>
            </label>
        </div>
        <div class="cms-spl__row">
            <label>
                Topic
                <select data-topic="" name="topic">
                    <option>
                        General enquiry
                    </option>
                    <option>
                        New project
                    </option>
                    <option>
                        Support
                    </option>
                    <option>
                        Partnership
                    </option>
                </select>
            </label>
            <label>
                Preferred timing
                <input name="timing" placeholder="This week"/>
            </label>
        </div>
        <label>
            Message
            <textarea name="message" placeholder="Tell us what you need..." required="" rows="5"></textarea>
        </label>
        <div class="cms-spl__footer">
            <label class="cms-spl__check">
                <input required="" type="checkbox"/>
                I agree to the privacy notice.
            </label>
            <button type="submit">
                Send enquiry
            </button>
        </div>
        <p data-status="" role="status">
        </p>
    </form>
</section>

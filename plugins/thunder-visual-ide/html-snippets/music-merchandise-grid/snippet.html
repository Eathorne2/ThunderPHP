<section class="mmg">

                />

            <div>
                <small>Apparel</small>

                    <button>S</button>
                    <button class="is-selected">M</button>

                    <strong>$38</strong>
                    <button data-add>Add to bag</button>
                </footer>
            </div>
        </article>

        <article>
            <figure>
                <img
                    alt="Vinyl record package"
                    src="https://images.unsplash.com/photo-1539375665275-f9de415ef9ac?auto=format&amp;fit=crop&amp;w=800&amp;q=85"

            </figure>
            <div>
                <small>Vinyl</small>

                    <strong>$29</strong>
                    <button data-add>Add</button>

        </article>

        <article>
            <figure>
                <img
                    alt="Black cap merchandise"
                    src="https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&amp;fit=crop&amp;w=800&amp;q=85"

            <div>
                <small>Accessories</small>

                <footer>
                    <strong>$24</strong>
                    <button data-add>Add</button>
                </footer>
            </div>
        </article>

        <article>
            <figure>
                <img
                    alt="Music poster print"
                    src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&amp;fit=crop&amp;w=800&amp;q=85"

            </figure>
            <div>
                <small>Print</small>

<section class="content-tabs" data-tabs>
    <div class="content-tabs__list" role="tablist" aria-label="Feature information">
        <button class="content-tabs__tab is-active" type="button" role="tab" aria-selected="true" data-tab="overview">
            Overview
        </button>
        <button class="content-tabs__tab" type="button" role="tab" aria-selected="false" data-tab="features">
            Features
        </button>
        <button class="content-tabs__tab" type="button" role="tab" aria-selected="false" data-tab="support">
            Support
        </button>
    </div>
    <div class="content-tabs__panel is-active" role="tabpanel" data-panel="overview">
        <h3>Overview</h3>
        <p>Use tabs to organise related information without leaving the current page.</p>
    </div>
    <div class="content-tabs__panel" role="tabpanel" data-panel="features" hidden>
        <h3>Features</h3>
        <p>Edit the labels, content, colours and spacing to match your plugin.</p>
    </div>
    <div class="content-tabs__panel" role="tabpanel" data-panel="support" hidden>
        <h3>Support</h3>
        <p>The JavaScript is scoped to this component through the supplied root element.</p>
    </div>
</section>

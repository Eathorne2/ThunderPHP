<section class="photo-gallery">
    <header>
        <span>Featured moments</span>
        <h2>Project gallery</h2>
    </header>
    <div class="photo-gallery__grid">
        <button
            type="button"
            data-photo-item
            data-src="https://picsum.photos/id/1015/1200/800"
            data-caption="Mountain lake"
        >
            <img src="https://picsum.photos/id/1015/600/420" alt="Mountain lake">
            <span>Mountain lake</span>
        </button>
        <button
            type="button"
            data-photo-item
            data-src="https://picsum.photos/id/1016/1200/800"
            data-caption="Forest trail"
        >
            <img src="https://picsum.photos/id/1016/600/420" alt="Forest trail">
            <span>Forest trail</span>
        </button>
        <button
            type="button"
            data-photo-item
            data-src="https://picsum.photos/id/1025/1200/800"
            data-caption="Friendly dog"
        >
            <img src="https://picsum.photos/id/1025/600/420" alt="Friendly dog">
            <span>Friendly dog</span>
        </button>
        <button
            type="button"
            data-photo-item
            data-src="https://picsum.photos/id/1035/1200/800"
            data-caption="River valley"
        >
            <img src="https://picsum.photos/id/1035/600/420" alt="River valley">
            <span>River valley</span>
        </button>
        <button
            type="button"
            data-photo-item
            data-src="https://picsum.photos/id/1040/1200/800"
            data-caption="Old castle"
        >
            <img src="https://picsum.photos/id/1040/600/420" alt="Old castle">
            <span>Old castle</span>
        </button>
        <button
            type="button"
            data-photo-item
            data-src="https://picsum.photos/id/1043/1200/800"
            data-caption="Urban lights"
        >
            <img src="https://picsum.photos/id/1043/600/420" alt="Urban lights">
            <span>Urban lights</span>
        </button>
    </div>
    <dialog class="photo-gallery__dialog" data-photo-dialog>
        <button type="button" data-photo-close aria-label="Close">×</button>
        <img data-photo-dialog-image alt="">
        <p data-photo-dialog-caption></p>
    </dialog>
</section>

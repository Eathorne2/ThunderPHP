<section class="nsmg">
    <header>
        <div>
            <p>City Screen / This week</p>
            <h2>Now showing</h2>
        </div>

        <div class="nsmg__filters">
            <button class="is-active" data-genre="all">All</button>
            <button data-genre="drama">Drama</button>
            <button data-genre="documentary">Documentary</button>
            <button data-genre="family">Family</button>
        </div>
    </header>

    <div class="nsmg__grid">
        <article data-film data-genre="drama">
            <figure>
                <img
                    alt="Movie poster showing a city at night"
                    src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&amp;fit=crop&amp;w=800&amp;q=85"
                />
                <span>16</span>
            </figure>
            <div>
                <small>Drama / Mystery / 118 min</small>
                <h3>The Last Frame</h3>
                <div class="nsmg__times">
                    <button>14:10</button>
                    <button>18:30</button>
                    <button>21:15</button>
                </div>
            </div>
        </article>

        <article data-film data-genre="documentary">
            <figure>
                <img
                    alt="Documentary poster with mountain landscape"
                    src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=800&amp;q=85"
                />
                <span>PG</span>
            </figure>
            <div>
                <small>Documentary / Nature / 96 min</small>
                <h3>Above the Cloud Line</h3>
                <div class="nsmg__times">
                    <button>12:20</button>
                    <button>16:45</button>
                    <button>19:20</button>
                </div>
            </div>
        </article>

        <article data-film data-genre="family">
            <figure>
                <img
                    alt="Family movie poster with colorful lights"
                    src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&amp;fit=crop&amp;w=800&amp;q=85"
                />
                <span>PG</span>
            </figure>
            <div>
                <small>Family / Adventure / 104 min</small>
                <h3>The Lantern Makers</h3>
                <div class="nsmg__times">
                    <button>10:30</button>
                    <button>13:00</button>
                    <button>17:10</button>
                </div>
            </div>
        </article>

        <article data-film data-genre="drama">
            <figure>
                <img
                    alt="Independent film poster with woman by a window"
                    src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?auto=format&amp;fit=crop&amp;w=800&amp;q=85"
                />
                <span>12</span>
            </figure>
            <div>
                <small>Drama / Romance / 111 min</small>
                <h3>Letters in June</h3>
                <div class="nsmg__times">
                    <button>15:40</button>
                    <button>18:50</button>
                    <button>20:45</button>
                </div>
            </div>
        </article>
    </div>
</section>

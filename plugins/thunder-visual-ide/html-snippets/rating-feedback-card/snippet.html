<section class="rfc-car" data-rfc-car="">
    <header>
        <span>
            Help us improve
        </span>
        <h2>
            Rating Feedback Card
        </h2>
    </header>
    <div class="rfc-car__stars">
        <button aria-label="1 stars" data-rating="1" type="button">
            ★
        </button>
        <button aria-label="2 stars" data-rating="2" type="button">
            ★
        </button>
        <button aria-label="3 stars" data-rating="3" type="button">
            ★
        </button>
        <button aria-label="4 stars" data-rating="4" type="button">
            ★
        </button>
        <button aria-label="5 stars" data-rating="5" type="button">
            ★
        </button>
    </div>
    <textarea placeholder="Tell us what stood out..." rows="3"></textarea>
    <button class="rfc-car__submit" data-submit="" type="button">
        Send feedback
    </button>
    <p aria-live="polite" class="rfc-car__message" data-message="">
    </p>
</section>

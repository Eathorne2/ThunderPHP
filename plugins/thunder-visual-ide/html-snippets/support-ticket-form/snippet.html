<section class="support-form">
    <header>
        <div class="support-form__icon">?</div>
        <div>
            <span>Support centre</span>
            <h2>Open a support ticket</h2>
            <p>Describe the issue and include enough detail for a faster response.</p>
        </div>
    </header>
    <form action="" method="post" enctype="multipart/form-data">
        <div class="support-form__row">
            <label>
                Category
                <select name="category">
                    <option>Technical issue</option>
                    <option>Billing</option>
                    <option>Account access</option>
                    <option>Feature request</option>
                </select>
            </label>
            <label>
                Priority
                <select name="priority">
                    <option>Normal</option>
                    <option>High</option>
                    <option>Urgent</option>
                </select>
            </label>
        </div>
        <label>
            Subject
            <input type="text" name="subject" placeholder="A short summary" required>
        </label>
        <label>
            Description
            <textarea
                name="description"
                rows="6"
                maxlength="600"
                placeholder="What happened, what did you expect, and what have you tried?"
                data-support-message
                required
            ></textarea>
            <small>
                <span data-support-count>0</span>
                /600 characters
            </small>
        </label>
        <label class="support-form__upload">
            <input type="file" name="attachment">
            <strong>Attach a screenshot or log file</strong>
            <span>PNG, JPG, PDF or TXT up to 10 MB</span>
        </label>
        <div class="support-form__footer">
            <label class="copy">
                <input type="checkbox" name="copy">
                Email me a copy
            </label>
            <button type="submit">Submit ticket</button>
        </div>
    </form>
</section>

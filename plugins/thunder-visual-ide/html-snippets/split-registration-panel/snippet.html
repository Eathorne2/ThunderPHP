<section class="srp-auth">
    <aside>
        <span>START BUILDING</span>
        <h2>One account for your whole workflow.</h2>
        <p>Create projects, publish reusable assets and collaborate with your team.</p>
        <ul>
            <li>✓ Unlimited local projects</li>
            <li>✓ Reusable graph presets</li>
            <li>✓ Marketplace-ready packages</li>
        </ul>
    </aside>
    <form>
        <h3>Create your account</h3>
        <div class="srp-auth__names">
            <label>
                First name
                <input type="text" required>
            </label>
            <label>
                Last name
                <input type="text" required>
            </label>
        </div>
        <label>
            Email
            <input type="email" required>
        </label>
        <label>
            Password
            <input type="password" required>
        </label>
        <label class="srp-auth__agree">
            <input type="checkbox" required>
            I agree to the terms and privacy policy.
        </label>
        <button type="submit">Create account</button>
        <p>
            Already registered?
            <a href="#">Sign in</a>
        </p>
    </form>
</section>

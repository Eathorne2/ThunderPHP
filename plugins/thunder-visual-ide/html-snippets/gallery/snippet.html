<section class="mosaic-gallery" aria-label="Project gallery">
    <button
        class="mosaic-gallery__item mosaic-gallery__item--wide"
        type="button"
        data-gallery-item
        data-label="Mountain landscape"
    >
        <span class="mosaic-gallery__art mosaic-gallery__art--one"></span>
        <span>Mountain landscape</span>
    </button>
    <button class="mosaic-gallery__item" type="button" data-gallery-item data-label="City lights">
        <span class="mosaic-gallery__art mosaic-gallery__art--two"></span>
        <span>City lights</span>
    </button>
    <button class="mosaic-gallery__item" type="button" data-gallery-item data-label="Ocean view">
        <span class="mosaic-gallery__art mosaic-gallery__art--three"></span>
        <span>Ocean view</span>
    </button>
    <button
        class="mosaic-gallery__item mosaic-gallery__item--wide"
        type="button"
        data-gallery-item
        data-label="Desert road"
    >
        <span class="mosaic-gallery__art mosaic-gallery__art--four"></span>
        <span>Desert road</span>
    </button>
    <dialog class="mosaic-gallery__dialog" data-gallery-dialog>
        <button type="button" class="mosaic-gallery__close" data-gallery-close aria-label="Close gallery">×</button>
        <div class="mosaic-gallery__dialog-art" data-gallery-dialog-art></div>
        <strong data-gallery-dialog-label></strong>
    </dialog>
</section>

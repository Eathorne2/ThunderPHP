<section class="tds">
    <div class="tds__heading">
        <p>Start somewhere remarkable</p>
        <h2>Where should the next story begin?</h2>
    </div>
    <div class="tds__panel">
        <div aria-label="Travel search type" class="tds__tabs" role="tablist">
            <button class="is-active" data-search-tab="stays" type="button">Stays</button>
            <button data-search-tab="tours" type="button">Tours</button>
            <button data-search-tab="escapes" type="button">Escapes</button>
        </div>
        <form class="tds__form">
            <label class="tds__destination">
                <span>Destination</span>
                <input placeholder="City, coast or country" type="search">
            </label>
            <label>
                <span data-date-label>Arrival</span>
                <input type="date">
            </label>
            <label>
                <span>Travellers</span>
                <select>
                    <option>2 travellers</option>
                    <option>1 traveller</option>
                    <option>Family of 4</option>
                    <option>Group of 6+</option>
                </select>
            </label>
            <button type="submit">Search stays</button>
        </form>
        <div class="tds__popular">
            <span>Trending:</span>
            <button type="button">Zanzibar</button>
            <button type="button">Cape Town</button>
            <button type="button">Santorini</button>
            <button type="button">Victoria Falls</button>
        </div>
    </div>
</section>

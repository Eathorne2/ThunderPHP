<section class="ig-editorial-mosaic">
    <header class="ig-editorial-mosaic__heading">
        <div>
            <p>Selected stories</p>
            <h2>Frames from the field</h2>
        </div>
        <span>Issue 08 · Visual journal</span>
    </header>

    <div class="ig-editorial-mosaic__grid">
        <button type="button" data-photo data-large="https://picsum.photos/id/1015/1800/1200" data-caption="Mountain passage">
            <img src="https://picsum.photos/id/1015/1100/800" alt="Mountain valley beside a river">
            <span>01 · Landscape</span>
        </button>
        <button type="button" data-photo data-large="https://picsum.photos/id/1027/1400/1700" data-caption="Portrait study">
            <img src="https://picsum.photos/id/1027/760/920" alt="Portrait study">
            <span>02 · Portrait</span>
        </button>
        <button type="button" data-photo data-large="https://picsum.photos/id/1031/1600/1100" data-caption="Coastal silence">
            <img src="https://picsum.photos/id/1031/900/620" alt="Rocky coast and calm water">
            <span>03 · Coast</span>
        </button>
        <button type="button" data-photo data-large="https://picsum.photos/id/1040/1600/1200" data-caption="City rhythm">
            <img src="https://picsum.photos/id/1040/900/680" alt="Urban architecture">
            <span>04 · City</span>
        </button>
        <button type="button" data-photo data-large="https://picsum.photos/id/1067/1600/1300" data-caption="Open horizon">
            <img src="https://picsum.photos/id/1067/1000/760" alt="Open landscape under a wide sky">
            <span>05 · Journey</span>
        </button>
    </div>

    <dialog class="ig-editorial-mosaic__lightbox" data-lightbox>
        <button type="button" aria-label="Close image" data-close>×</button>
        <img alt="Expanded gallery image" data-lightbox-image>
        <p data-lightbox-caption></p>
    </dialog>
</section>

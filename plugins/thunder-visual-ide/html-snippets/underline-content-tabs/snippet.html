<section class="uct-tabs" data-uct-tabs>
    <div class="uct-tabs__list" role="tablist">
        <button class="is-active" role="tab" aria-selected="true" data-uct-tab="overview">Overview</button>
        <button role="tab" aria-selected="false" data-uct-tab="activity">Activity</button>
        <button role="tab" aria-selected="false" data-uct-tab="settings">Settings</button>
    </div>
    <div class="uct-tabs__panel" data-uct-panel="overview">
        <h3>Workspace overview</h3>
        <p>See the latest project status and important metrics.</p>
    </div>
    <div class="uct-tabs__panel" data-uct-panel="activity" hidden>
        <h3>Recent activity</h3>
        <p>Review updates made by you and your collaborators.</p>
    </div>
    <div class="uct-tabs__panel" data-uct-panel="settings" hidden>
        <h3>Workspace settings</h3>
        <p>Control naming, access and notification preferences.</p>
    </div>
</section>

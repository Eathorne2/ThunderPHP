<section class="contact-office">
    <aside class="contact-office__info">
        <span class="contact-office__eyebrow">Contact us</span>
        <h2>Let’s discuss your next project.</h2>
        <p>Tell us what you are building and our team will respond within one working day.</p>
        <dl>
            <div>
                <dt>Email</dt>
                <dd>hello@example.com</dd>
            </div>
            <div>
                <dt>Phone</dt>
                <dd>+260 770 000 000</dd>
            </div>
            <div>
                <dt>Office</dt>
                <dd>Great East Road, Lusaka</dd>
            </div>
        </dl>
        <div class="contact-office__hours">
            <strong>Opening hours</strong>
            <span>Mon–Fri · 08:00–17:00</span>
        </div>
    </aside>
    <form class="contact-office__form">
        <div class="contact-office__grid">
            <label>
                Full name
                <input type="text" name="name" placeholder="Your name">
            </label>
            <label>
                Email address
                <input type="email" name="email" placeholder="you@example.com">
            </label>
        </div>
        <label>
            Topic
            <select name="topic">
                <option>New project</option>
                <option>Technical support</option>
                <option>Partnership</option>
            </select>
        </label>
        <label>
            Message
            <textarea name="message" placeholder="How can we help?"></textarea>
        </label>
        <label class="contact-office__check">
            <input type="checkbox">
            <span>I agree to be contacted about this enquiry.</span>
        </label>
        <button type="submit">Send enquiry</button>
    </form>
</section>

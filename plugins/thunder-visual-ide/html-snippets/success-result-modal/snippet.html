<section class="srm-alert" data-srm-alert>
    <button class="srm-alert__launcher" type="button" data-srm-open>Show success</button>
    <div class="srm-alert__backdrop" data-srm-modal hidden>
        <div class="srm-alert__dialog" role="alertdialog" aria-modal="true" aria-labelledby="srm-title">
            <div class="srm-alert__ring">
                <span>✓</span>
            </div>
            <p class="srm-alert__eyebrow">COMPLETED</p>
            <h2 id="srm-title">Everything is ready</h2>
            <p>Your changes were saved and are now available to the rest of the team.</p>
            <button class="srm-alert__primary" type="button" data-srm-close>Continue</button>
        </div>
    </div>
</section>

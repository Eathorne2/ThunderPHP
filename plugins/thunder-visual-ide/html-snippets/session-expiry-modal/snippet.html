<div class="sem-mod" data-sem-mod="">
    <button class="sem-mod__button" data-open="" type="button">
        Open Session Expiry Modal
    </button>
    <div class="sem-mod__backdrop" data-dialog="" hidden="">
        <section aria-labelledby="sem-mod-title" aria-modal="true" class="sem-mod__dialog" role="dialog">
            <span aria-hidden="true" class="sem-mod__icon">
                !
            </span>
            <p class="sem-mod__eyebrow">
                Confirmation required
            </p>
            <h2 id="sem-mod-title">
                Session Expiry Modal
            </h2>
            <p>
                This action affects shared workspace data. Review the details before continuing.
            </p>
            <div class="sem-mod__details">
                <span>
                    Scope
                </span>
                <strong>
                    Current workspace
                </strong>
                <span>
                    Impact
                </span>
                <strong>
                    Immediate
                </strong>
            </div>
            <div class="sem-mod__actions">
                <button class="sem-mod__button sem-mod__button--quiet" data-close="" type="button">
                    Cancel
                </button>
                <button class="sem-mod__button" data-confirm="" type="button">
                    Continue
                </button>
            </div>
        </section>
    </div>
</div>

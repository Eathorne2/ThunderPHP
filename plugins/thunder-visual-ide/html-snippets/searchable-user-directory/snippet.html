<section class="user-directory">
    <header>
        <div>
            <span>People</span>
            <h2>Find a team member</h2>
        </div>
        <input type="search" placeholder="Search users or roles" data-user-search>
    </header>
    <div class="user-directory__grid">
        <article class="directory-user" data-user-card>
            <div class="directory-user__avatar directory-user__avatar--blue">JM</div>
            <div>
                <h3>Joseph Mwila</h3>
                <p>Backend developer</p>
            </div>
            <span class="availability availability--online">Available</span>
            <button type="button">View</button>
        </article>
        <article class="directory-user" data-user-card>
            <div class="directory-user__avatar directory-user__avatar--pink">RN</div>
            <div>
                <h3>Ruth Ngoma</h3>
                <p>Product manager</p>
            </div>
            <span class="availability availability--busy">Busy</span>
            <button type="button">View</button>
        </article>
        <article class="directory-user" data-user-card>
            <div class="directory-user__avatar directory-user__avatar--green">SK</div>
            <div>
                <h3>Samuel Kunda</h3>
                <p>Support specialist</p>
            </div>
            <span class="availability availability--online">Available</span>
            <button type="button">View</button>
        </article>
        <article class="directory-user" data-user-card>
            <div class="directory-user__avatar directory-user__avatar--amber">TM</div>
            <div>
                <h3>Thandiwe M.</h3>
                <p>Finance officer</p>
            </div>
            <span class="availability availability--away">Away</span>
            <button type="button">View</button>
        </article>
    </div>
    <p class="user-directory__empty" data-user-empty hidden>No users match your search.</p>
</section>

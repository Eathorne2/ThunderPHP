<section class="toast-demo">
    <div>
        <span>Interface feedback</span>
        <h2>Toast notifications</h2>
        <p>Trigger lightweight messages without interrupting the current workflow.</p>
    </div>
    <div class="toast-demo__actions">
        <button type="button" data-toast="success">Show success</button>
        <button type="button" data-toast="warning">Show warning</button>
        <button type="button" data-toast="error">Show error</button>
    </div>
    <div class="toast-stack" aria-live="polite" data-toast-stack></div>
</section>

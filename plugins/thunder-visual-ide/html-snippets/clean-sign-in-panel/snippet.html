<section class="csip-auth">
    <header>
        <span>⚡</span>
        <div>
            <h2>Welcome back</h2>
            <p>Sign in to continue to your workspace.</p>
        </div>
    </header>
    <button class="csip-auth__social" type="button">Continue with Google</button>
    <div class="csip-auth__divider">
        <span>or continue with email</span>
    </div>
    <form>
        <label>
            Email
            <input type="email" placeholder="you@example.com" required>
        </label>
        <label>
            Password
            <input type="password" placeholder="Enter your password" required>
        </label>
        <div class="csip-auth__options">
            <label>
                <input type="checkbox">
                Remember me
            </label>
            <a href="#">Forgot password?</a>
        </div>
        <button class="csip-auth__submit" type="submit">Sign in</button>
    </form>
    <footer>
        New here?
        <a href="#">Create an account</a>
    </footer>
</section>

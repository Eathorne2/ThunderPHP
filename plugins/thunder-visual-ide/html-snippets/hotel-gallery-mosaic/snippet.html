<section class="hgm">
    <header>
        <div>
            <p>Inside the stay</p>
            <h2>Spaces made for unhurried days.</h2>
        </div>
        <div class="hgm__filters">
            <button class="is-active" data-gallery-filter="all" type="button">All</button>
            <button data-gallery-filter="rooms" type="button">Rooms</button>
            <button data-gallery-filter="dining" type="button">Dining</button>
            <button data-gallery-filter="wellness" type="button">Wellness</button>
        </div>
    </header>
    <div class="hgm__grid">
        <button data-kind="rooms" type="button">
            <img alt="Light-filled hotel suite" src="https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&amp;fit=crop&amp;w=1200&amp;q=85">
            <span>Horizon Suite</span>
        </button>
        <button data-kind="dining" type="button">
            <img alt="Elegant hotel restaurant" src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&amp;fit=crop&amp;w=900&amp;q=85">
            <span>Open-fire dining</span>
        </button>
        <button data-kind="wellness" type="button">
            <img alt="Spa treatment room" src="https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&amp;fit=crop&amp;w=900&amp;q=85">
            <span>Garden spa</span>
        </button>
        <button data-kind="rooms" type="button">
            <img alt="Hotel room with mountain view" src="https://images.unsplash.com/photo-1596394516093-501ba68a0ba6?auto=format&amp;fit=crop&amp;w=900&amp;q=85">
            <span>Mountain room</span>
        </button>
        <button data-kind="dining" type="button">
            <img alt="Restaurant interior" src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&amp;fit=crop&amp;w=900&amp;q=85">
            <span>Library bar</span>
        </button>
    </div>
    <dialog class="hgm__lightbox">
        <button aria-label="Close gallery" data-gallery-close type="button">×</button>
        <img alt="Selected hotel gallery image">
        <p>
        </p>
    </dialog>
</section>

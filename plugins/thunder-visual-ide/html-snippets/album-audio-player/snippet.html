<section class="album-player" data-media-player>
    <img class="album-player__cover" src="https://picsum.photos/id/1027/700/700" alt="Abstract album cover">

    <div class="album-player__content">
        <p class="album-player__eyebrow">Now playing</p>
        <h2>Open Roads</h2>
        <p class="album-player__artist">The Northern Lights</p>

        <audio preload="metadata" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

        <div class="album-player__timeline">
            <input type="range" min="0" max="100" value="0" step="0.1" aria-label="Audio progress" data-media-progress>
            <span data-media-time>0:00 / 0:00</span>
        </div>

        <div class="album-player__controls">
            <button type="button" aria-label="Previous track">Previous</button>
            <button class="is-primary" type="button" data-media-play>Play</button>
            <button type="button" aria-label="Next track">Next</button>
            <button type="button" data-media-mute>Mute</button>
        </div>

        <div class="album-player__meta">
            <span>Alternative</span>
            <span>2026</span>
            <span>High quality</span>
        </div>
    </div>
</section>

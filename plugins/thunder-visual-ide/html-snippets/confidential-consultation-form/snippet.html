<section class="blcf-section">
    <div class="blcf-intro"><span class="blcf-eyebrow">Start a conversation</span><h2>Tell us what requires attention.</h2><p>Share a short outline. A member of the appropriate practice team will respond confidentially.</p><dl><div><dt>Response time</dt><dd>Within one business day</dd></div><div><dt>Confidentiality</dt><dd>Handled with discretion</dd></div></dl></div>
    <form data-blcf-form>
        <label><span>Name</span><input name="name" required type="text"></label>
        <label><span>Work email</span><input name="email" required type="email"></label>
        <label><span>Area of support</span><select name="service"><option>Corporate and commercial</option><option>Dispute resolution</option><option>Employment law</option><option>Private client</option></select></label>
        <label><span>How can we help?</span><textarea name="message" rows="5"></textarea></label>
        <label class="blcf-consent"><input required type="checkbox"><span>I understand this message does not create an attorney-client relationship.</span></label>
        <button class="blcf-button" type="submit">Request consultation</button><small data-blcf-message></small>
    </form>
</section>

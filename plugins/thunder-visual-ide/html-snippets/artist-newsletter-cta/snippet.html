<section class="ancta">
    <div class="ancta__art">
        <img
            alt="Singer in a recording studio"
            src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&amp;fit=crop&amp;w=1200&amp;q=85"
        />
        <span>Private transmission / 01</span>
    </div>

    <div class="ancta__copy">
        <p>From the studio to your inbox</p>
        <h2>Hear it before everyone else.</h2>
        <span class="ancta__intro">
            Join for new-song previews, early tour dates and occasional notes from the road.
        </span>

        <form data-form>
            <label>
                <span>Email address</span>
                <input required placeholder="you@example.com" type="email" />
            </label>
            <button>Join the list</button>
        </form>

        <div class="ancta__benefits">
            <span>Early ticket access</span>
            <span>Private demos</span>
            <span>No weekly noise</span>
        </div>

        <p class="ancta__message" data-message aria-live="polite"></p>
    </div>
</section>

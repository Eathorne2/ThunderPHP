<section class="wsts">
    <div class="wsts__intro">
        <p>Reception seating</p>
        <h2>Find your table</h2>
        <span>Enter your first or last name to see where we have saved you a seat.</span>
    </div>

    <div class="wsts__search">
        <label for="wsts-name">Guest name</label>
        <div>
            <input id="wsts-name" data-input placeholder="Try “Chanda” or “Grant”" type="search" />
            <button data-search type="button">Find table</button>
        </div>
        <p data-result aria-live="polite">Table assignments will appear here.</p>
    </div>

    <div class="wsts__tables" aria-hidden="true">
        <span>01</span><span>02</span><span>03</span><span>04</span><span>05</span><span>06</span>
    </div>
</section>

<section class="minimal-contact">
    <header>
        <span>Send a message</span>
        <h2>What can we build together?</h2>
        <p>Share the goal, timeline and any useful context. We normally reply within 24 hours.</p>
    </header>
    <form>
        <label>
            <span>Your name</span>
            <input type="text" name="name" placeholder="Full name">
        </label>
        <label>
            <span>Email</span>
            <input type="email" name="email" placeholder="you@example.com">
        </label>
        <label>
            <span>Message</span>
            <textarea name="message" placeholder="Tell us about the project"></textarea>
        </label>
        <div class="minimal-contact__footer">
            <small>By sending this form you agree to our privacy policy.</small>
            <button type="submit">Send message →</button>
        </div>
    </form>
</section>

<div class="tvi-theme-preview">
  <form class="thv-form thv-grid" style="--thv-gap:1rem">
    <div class="thv-field thv-col-mobile-12 thv-col-medium-6"><div class="thv-theme-floating-control"><input id="preview-name" type="text" placeholder=" "><label for="preview-name">Full name</label></div></div>
    <div class="thv-field thv-col-mobile-12 thv-col-medium-6"><div class="thv-theme-floating-control"><input id="preview-email" type="email" placeholder=" "><label for="preview-email">Email address</label></div></div>
    <div class="thv-field thv-col-mobile-12"><div class="thv-theme-floating-control thv-theme-floating-control--select"><select id="preview-role"><option>Administrator</option><option>Editor</option></select><label for="preview-role">Account type</label></div></div>
    <div class="thv-field thv-col-mobile-12"><div class="thv-theme-floating-control thv-theme-floating-control--textarea"><textarea id="preview-message" placeholder=" "></textarea><label for="preview-message">About you</label></div></div>
    <div class="thv-field thv-checkbox thv-col-mobile-12"><input type="checkbox" checked><span class="thv-label">Send me product updates</span></div>
    <div class="thv-col-mobile-12"><button type="button" class="thv-button thv-button--primary">Create account</button></div>
  </form>
</div>

<div class="tvi-theme-preview">
  <form class="thv-form thv-grid" style="--thv-gap:1rem">
    <div class="thv-field thv-col-mobile-12"><div class="thv-theme-side-label"><label for="preview-name">Full name</label><div class="thv-theme-side-control"><input id="preview-name" type="text" placeholder="Steve Choongo"></div></div></div>
    <div class="thv-field thv-col-mobile-12"><div class="thv-theme-side-label"><label for="preview-email">Email address</label><div class="thv-theme-side-control"><input id="preview-email" type="email" placeholder="steve@example.com"></div></div></div>
    <div class="thv-field thv-col-mobile-12"><div class="thv-theme-side-label"><label for="preview-role">Account type</label><div class="thv-theme-side-control"><select id="preview-role"><option>Administrator</option><option>Editor</option></select></div></div></div>
    <div class="thv-field thv-col-mobile-12"><div class="thv-theme-side-label"><label for="preview-message">About you</label><div class="thv-theme-side-control"><textarea id="preview-message" placeholder="Tell us something useful"></textarea><div class="thv-error">A sample inline validation message</div></div></div></div>
    <div class="thv-field thv-checkbox thv-col-mobile-12"><div class="thv-theme-side-label"><span class="thv-theme-side-spacer"></span><div class="thv-theme-side-control"><input type="checkbox" checked><span class="thv-label">Send me product updates</span></div></div></div>
    <div class="thv-col-mobile-12"><button type="button" class="thv-button thv-button--primary">Save profile</button></div>
  </form>
</div>
